name: Release

# Publishes a version such as 1.00 with the HACS zip after the checks pass.
# Versions have two decimal places and count up by 0.01, from 1.00 to 1.99 and
# then 2.00, and tags carry no "v". It runs from "Run workflow", which picks
# the version after the newest release, when a push to main changes the version
# in manifest.json, or when a version tag is pushed.
#
# The notes are CHANGELOG.md's newest section, headed "## Unreleased" (or
# "## 1.08 (unreleased)"). Except for a pushed tag, whose commit is fixed, the
# release commits the version to manifest.json and heads that section with it,
# such as "## 1.08". A version that already has a release only gets its zip
# replaced.
on:
  push:
    branches: [main]
    tags: ["[0-9]*"]
    paths: [custom_components/subzero/manifest.json]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version to release: minor adds 0.01, such as 1.07 to 1.08; major moves to the next whole number, such as 1.07 to 2.00"
        required: true
        default: minor
        type: choice
        options: [minor, major]

permissions:
  contents: read

jobs:
  plan:
    name: Choose the version
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - id: version
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST: custom_components/subzero/manifest.json
        run: |
          fail() { echo "::error::$1"; exit 1; }
          release() { python .github/scripts/release.py "$@"; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || fail "Run the release from main."
            version=$(release next "$BUMP") || exit 1
            echo "::notice::Releasing $version."
          else
            version=$(jq -r .version "$MANIFEST")
          fi
          # Home Assistant refuses a two-decimal version with a suffix such as
          # 1.01b1, so there are no pre-releases.
          [[ $version =~ ^[0-9]+\.[0-9]{2}$ ]] \
            || fail "$version is not a version such as 1.00 or 1.01, with two decimal places."
          tagged=$(git rev-parse -q --verify "refs/tags/$version^{commit}" || true)

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$version" = "$GITHUB_REF_NAME" ] \
              || fail "manifest.json has version $version, but the tag is $GITHUB_REF_NAME."
          elif [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            # manifest.json changed without a new version.
            echo "::notice::$version is already tagged on an earlier commit, so there is nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$tagged" ]; then
            release newer "$version"
          fi
          # Fails before the checks run if the changes aren't listed.
          if ! gh release view "$version" > /dev/null 2>&1; then
            release changelog "$version"
          fi

          {
            echo "publish=true"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  checks:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/validate.yml

  publish:
    name: Publish ${{ needs.plan.outputs.version }}
    needs: [plan, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release at a time, so a tag pushed along with its version bump
    # finds the release the other run made.
    concurrency:
      group: release
    env:
      GH_TOKEN: ${{ github.token }}
      MANIFEST: custom_components/subzero/manifest.json
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # Pushes made with the workflow token start no other workflows, so this
      # commit, which changes only the version and the changelog's heading, is
      # not checked again. A pushed tag's commit can't change.
      - name: Commit the version
        if: github.ref_type == 'branch'
        run: |
          sed -i -E "s/(\"version\": *\")[^\"]*\"/\1$VERSION\"/" "$MANIFEST"
          if [ "$(jq -r .version "$MANIFEST")" != "$VERSION" ]; then
            echo "::error::Could not set the version in manifest.json."
            exit 1
          fi
          python .github/scripts/release.py changelog "$VERSION" --finish
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release $VERSION"
          git push origin HEAD:main

      # HACS extracts the zip into custom_components/subzero, so the
      # integration files must sit at the root of the archive.
      - name: Build the zip
        run: |
          git archive --format=zip -o ha_subzero.zip HEAD:custom_components/subzero
          unzip -p ha_subzero.zip manifest.json \
            | jq -e --arg version "$VERSION" '.version == $version' > /dev/null

      # The notes are the release's section of CHANGELOG.md. GitHub appends
      # any pull requests and new contributors, and a link comparing it with
      # the previous release, which may be an older v0.x.y tag but not one of
      # its betas.
      - name: Publish the release
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" ha_subzero.zip --clobber
            exit 0
          fi
          python .github/scripts/release.py changelog "$VERSION" --notes notes.md
          cat notes.md
          PREVIOUS=$(git describe --tags --abbrev=0 --match '[0-9]*' --match 'v[0-9]*' \
            --exclude 'v*[!0-9.]*' HEAD^ 2> /dev/null || true)
          flags=(--target "$(git rev-parse HEAD)" --title "$VERSION" --notes-file notes.md --generate-notes)
          if [ -n "$PREVIOUS" ]; then
            flags+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$VERSION" ha_subzero.zip "${flags[@]}"
