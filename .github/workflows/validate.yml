name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum in hacs.json and the latest release. Home Assistant 2026.11
        # moved its test helpers to pytest-homeassistant, which can't be installed
        # beside pytest-homeassistant-custom-component, so each entry names its own.
        include:
          - homeassistant: '2026.8.0'
            test-package: pytest-homeassistant-custom-component==0.13.354
          - homeassistant: '2026.11.1'
            test-package: pytest-homeassistant==2026.11.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt "homeassistant==${{ matrix.homeassistant }}" "${{ matrix.test-package }}"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    name: Sidebar panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      # The integration serves the committed bundle, so it has to match the source.
      - name: Committed bundle is up to date
        run: git diff --exit-code -- ../custom_components/subzero/frontend

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit, like the HACS check below, so a change to either action is
      # one Dependabot proposes rather than one that runs unseen.
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      # Topics and issues matter only for the HACS default store, not for
      # installing this repository as a custom repository.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: false
          ignore: issues topics
