name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ['2026.8.0', '2026.9.4', '2026.10.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt "homeassistant==${{ matrix.homeassistant }}"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    name: Sidebar panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      # The integration serves the committed bundle, so it has to match the source.
      - name: Committed bundle is up to date
        run: git diff --exit-code -- ../custom_components/subzero/frontend

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      # Topics and issues matter only for the HACS default store, not for
      # installing this repository as a custom repository.
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
          ignore: issues topics
