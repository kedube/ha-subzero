[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "logs_errors: the test makes the integration log an exception, or add an entity twice, on purpose",
]
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".private", ".research", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
